name: Offer Mapping and Commercial Release Gates

on:
  pull_request:
    paths:
      - 'api/**'
      - 'functions/api/**'
      - 'index.html'
      - 'landing-pages/**'
      - 'tests/verify-live-offers.mjs'
      - 'tests/verify-commercial-release-gate.mjs'
      - '.github/workflows/live-offer-contract.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'functions/api/**'
      - 'index.html'
      - 'landing-pages/**'
      - 'tests/verify-live-offers.mjs'
      - 'tests/verify-commercial-release-gate.mjs'
      - '.github/workflows/live-offer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify catalog mapping (not sale eligibility)
        run: node tests/verify-live-offers.mjs
      - name: Verify fail-closed commercial release policy
        run: node tests/verify-commercial-release-gate.mjs
